name: Build Android TV APK (arm64 + armv7)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Force both ABIs in ONE universal APK
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/abis.gradle" <<'EOF'
          allprojects { p ->
            p.pluginManager.withPlugin("com.android.application") {
              def android = p.extensions.getByName("android")
              android.defaultConfig.ndk.abiFilters.clear()
              android.defaultConfig.ndk.abiFilters.addAll(["arm64-v8a", "armeabi-v7a"])
              android.splits.abi.enable = false
            }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x ./gradlew
          TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          if [ "$TYPE" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify ABIs inside the APK
        run: |
          for apk in $(find . -name "*.apk" -path "*outputs/apk*"); do
            echo "== $apk"
            unzip -l "$apk" | grep -o 'lib/[^/]*/' | sort -u
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
