[versions]
android-plugin = "9.4.1"
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "29"
java-jdk = "21"
appcompat = "1.7.1"
recyclerview = "1.4.0"
core-ktx = "1.19.1"
lifecycle = "2.11.0"
coroutines = "1.11.0"
media3 = "1.11.1"
okhttp = "5.5.0"
junit = "4.13.2"
robolectric = "4.17"

[plugins]
android-app = { id = "com.android.application", version.ref = "android-plugin" }

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-mediarouter = { module = "androidx.mediarouter:mediarouter", version = "1.8.1" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
